{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar facilities map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #app { display: flex; height: 100%; }
    #sidebar { width: 320px; flex: none; overflow-y: auto; padding: 16px; box-sizing: border-box;
               border-right: 1px solid #ddd; background: #fafafa; }
    #sidebar h1 { font-size: 1.1rem; margin: 0 0 4px; }
    #status { color: #555; font-size: 0.9rem; margin: 0 0 12px; }
    #results { list-style: none; margin: 0; padding: 0; }
    #results li { padding: 8px 0; border-bottom: 1px solid #e4e4e4; }
    #results .name { font-weight: 600; }
    #results .meta { color: #555; font-size: 0.85rem; }
    #map { flex: 1; min-width: 0; }
    @media (max-width: 600px) {
      #app { flex-direction: column-reverse; }
      #sidebar { width: auto; max-height: 40%; border-right: 0; border-top: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>Nearest solar facilities</h1>
      <p id="status">Click the map to find the nearest solar facilities.</p>
      <ol id="results"></ol>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  {# json_script escapes the values, so an env-supplied attribution or URL can't break out of the tag. #}
  {{ basemap|json_script:"basemap-config" }}
  <script>
    window.SOLAR_MAP_CONFIG = {
      // Vector tiles (see facilities/tiles.py). {z}/{x}/{y} are MapLibre placeholders, so the path
      // is written out here; a test keeps it in step with the route in config/urls.py.
      tilesPath: "/tiles/{z}/{x}/{y}.mvt",
      tilesMaxZoom: 14,
      // Zoom at which tiles begin to include polygons (same constant the server uses).
      polygonMinZoom: {{ polygon_min_zoom }},
      nearestUrl: "/api/facilities/nearest/",
      nearestCount: 5,
      // On load, if the browser shares its location, zoom to this radius around the user.
      userRadiusKm: 100,
    };
  </script>
  <script src="{% static 'facilities/map.js' %}"></script>
</body>
</html>
