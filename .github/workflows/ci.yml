# CI: the same gate as locally (`task check`), plus an image per commit on main.
# Deploys are separate and manual: see deploy.yml and docs/deploy.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR/branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/solar-map-web

jobs:
  # Job id is the required status check name on main; keep it stable.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: hashicorp/setup-terraform@v3
      # backend/.env comes from the example, exactly as for a new contributor.
      - run: task env
      # ruff + Django tests (against the compose PostGIS) + terraform fmt/validate.
      - run: task check

  image:
    # Only commits that reach main get an image; PRs are checked, not published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Re-running CI on the same commit shouldn't rebuild an image that already exists.
      - id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ github.sha }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          # Links the package to this repo, so it inherits the repo's (public) visibility.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
