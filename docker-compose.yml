services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: solar_map
      POSTGRES_USER: solar_map
      POSTGRES_PASSWORD: solar_map
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar_map -d solar_map"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
