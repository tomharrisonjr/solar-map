services:
  db:
    # Community multi-arch build (amd64 + arm64); the official postgis/postgis image is
    # amd64-only, which runs under emulation on Apple Silicon.
    image: imresamu/postgis:16-3.4
    environment:
      POSTGRES_DB: solar_map
      POSTGRES_USER: solar_map
      POSTGRES_PASSWORD: solar_map
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 probes over TCP: on a fresh volume the image first runs a temporary
      # init server that listens only on the Unix socket, so a socket probe can report
      # "healthy" just before the real server restarts. Only the real server listens on TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U solar_map -d solar_map"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
