version: "3"

# Deterministic dev workflow, runnable by a human, CI, or any coding agent.
# Django always runs inside Docker Compose (GDAL/GEOS live in the `web` image).

vars:
  # The primary checkout, even when invoked from inside a worktree.
  MAIN_DIR:
    sh: dirname "$(git rev-parse --path-format=absolute --git-common-dir)"
  # Worktrees live in a sibling folder: ../solar-map.worktrees/<branch-slug>/
  WT_ROOT: "{{.MAIN_DIR}}.worktrees"
  # Base ref for new branches; override with `BASE=some-branch task wt:new -- ...`.
  BASE: '{{default "main" .BASE}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  lint:
    desc: Run ruff
    cmds:
      - docker compose run --rm web ruff check .

  test:
    desc: Run the Django test suite
    cmds:
      - docker compose run --rm web python manage.py test

  check:
    desc: Lint + tests (+ Terraform format/validate when terraform is installed) — the gate before calling a change done
    cmds:
      - task: lint
      - task: test
      - task: tf:check

  tf:check:
    desc: terraform fmt -check + validate (skipped if terraform isn't installed)
    # Needs no AWS credentials: validate runs with -backend=false and talks to nothing. It uses its
    # own data dir so an initialised S3 backend in infra/.terraform can't pull credentials in.
    env:
      TF_DATA_DIR: .terraform/check
    cmds:
      - |
        if ! command -v terraform >/dev/null 2>&1; then
          echo "terraform not installed; skipping infra checks"
          exit 0
        fi
        terraform -chdir=infra fmt -check -recursive
        terraform -chdir=infra init -backend=false -input=false >/dev/null
        terraform -chdir=infra validate
        terraform -chdir=infra/bootstrap init -backend=false -input=false >/dev/null
        terraform -chdir=infra/bootstrap validate

  # One-time (per AWS account): creates the S3 bucket that holds the main stack's state. Its own
  # state stays local in infra/bootstrap/ (gitignored). Uses AWS_PROFILE / TF_VAR_aws_profile.
  tf:bootstrap:
    desc: Create the S3 bucket for Terraform state (once per AWS account)
    cmds:
      - terraform -chdir=infra/bootstrap init
      - terraform -chdir=infra/bootstrap apply

  tf:init:
    desc: Initialise Terraform in infra/ against the S3 state bucket (add `-- -migrate-state` to move local state)
    cmds:
      - terraform -chdir=infra init -backend-config=backend.hcl {{.CLI_ARGS}}

  tf:fmt:
    desc: Format the Terraform files
    cmds:
      - terraform -chdir=infra fmt -recursive

  # One Terraform workspace per environment (dev, staging, prod); state for each lives in
  # the S3 bucket (key env:/<env>/solar-map/terraform.tfstate). ENV picks the workspace (via TF_WORKSPACE, so the
  # selection never lingers in local files) and infra/envs/<ENV>.tfvars. Machine-specific values
  # (profile, SSH CIDR) live in the gitignored infra/terraform.tfvars, shared by all envs.
  tf:workspace:
    desc: "Create the Terraform workspace for an environment if missing: task tf:workspace ENV=dev"
    requires:
      vars:
        - name: ENV
          enum: [dev, staging, prod]
    cmds:
      # TF_WORKSPACE is cleared here because `select` itself refuses to run when it's set.
      - TF_WORKSPACE= terraform -chdir=infra workspace select -or-create {{.ENV}}

  tf:plan:
    desc: "Show what Terraform would change in AWS: task tf:plan ENV=dev"
    requires:
      vars:
        - name: ENV
          enum: [dev, staging, prod]
    cmds:
      - task: tf:workspace
        vars: {ENV: "{{.ENV}}"}
      - TF_WORKSPACE={{.ENV}} terraform -chdir=infra plan -var-file=envs/{{.ENV}}.tfvars

  tf:apply:
    desc: "Apply the Terraform plan — creates billable AWS resources: task tf:apply ENV=dev"
    requires:
      vars:
        - name: ENV
          enum: [dev, staging, prod]
    cmds:
      - task: tf:workspace
        vars: {ENV: "{{.ENV}}"}
      - TF_WORKSPACE={{.ENV}} terraform -chdir=infra apply -var-file=envs/{{.ENV}}.tfvars

  migrate:
    desc: Apply database migrations
    cmds:
      - docker compose up -d --wait db
      - docker compose run --rm web python manage.py migrate

  env:
    desc: Create backend/.env from backend/.env.example if it doesn't exist
    # Skipped when backend/.env already exists (also true in worktrees: wt:new symlinks it).
    status:
      - test -e backend/.env
    cmds:
      - cp backend/.env.example backend/.env
      - echo "Created backend/.env from backend/.env.example"

  data:load:
    desc: "Download and load the USPVDB dataset (safe to re-run): task data:load [-- <path-or-url>]"
    cmds:
      - task: migrate
      - docker compose run --rm web python manage.py load_uspvdb {{.CLI_ARGS}}

  setup:
    desc: First-time setup on a fresh clone — .env, build image, migrate, load the dataset
    cmds:
      - task: env
      - docker compose build web
      - task: data:load
      - task: venv
      - task: vscode

  wt:list:
    desc: List git worktrees
    cmds:
      - git worktree list | grep -v '\[main\]' || true

  wt:new:
    silent: true
    desc: "Create a worktree + branch: task wt:new -- <type>/gh-<n>-<desc>"
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "usage: task wt:new -- <type>/gh-<n>-<desc>   (e.g. feature/gh-5-nearest-api)"
    cmds:
      - |
        branch="{{.CLI_ARGS}}"
        slug="$(echo "$branch" | tr '/' '-')"
        path="{{.WT_ROOT}}/$slug"

        git worktree add -b "$branch" "$path" "{{.BASE}}"

        # backend/.env is gitignored: share the primary checkout's copy via symlink so
        # there is one source of truth (seed it from .env.example if it doesn't exist).
        if [ ! -e "{{.MAIN_DIR}}/backend/.env" ]; then
          cp "{{.MAIN_DIR}}/backend/.env.example" "{{.MAIN_DIR}}/backend/.env"
        fi
        ln -s "{{.MAIN_DIR}}/backend/.env" "$path/backend/.env"

        # Free host ports so this worktree's compose stack can run beside others.
        free_port() {
          python3 -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])"
        }
        printf 'DB_PORT=%s\nWEB_PORT=%s\n' "$(free_port)" "$(free_port)" > "$path/.env"

        echo
        echo "Worktree ready: $path"
        echo "Branch:         $branch (from {{.BASE}})"
        echo "Ports:          $(tr '\n' ' ' < "$path/.env")"

  wt:rm:
    silent: true
    desc: "Remove a worktree, its compose stack/volume, and its merged branch: task wt:rm -- <branch>"
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "usage: task wt:rm -- <type>/gh-<n>-<desc>"
    cmds:
      - |
        branch="{{.CLI_ARGS}}"
        slug="$(echo "$branch" | tr '/' '-')"
        path="{{.WT_ROOT}}/$slug"

        # --rmi local also deletes the `web` image this worktree built (~1.5 GB, named after the
        # folder), which would otherwise pile up once per removed worktree.
        (cd "$path" && docker compose down -v --rmi local)
        rm -f "$path/backend/.env" "$path/.env"
        git worktree remove "$path"
        # -d refuses to delete a branch that hasn't been merged.
        git branch -d "$branch"
  
  venv:
    desc: "Create backend/.venv for editor import resolution (Django still runs in Docker)"
    # Re-runs only when the requirements change or the venv is missing; `task venv --force` rebuilds.
    sources:
      - backend/requirements.txt
      - backend/requirements-dev.txt
    generates:
      - backend/.venv/pyvenv.cfg
    cmds:
      - '[ -d backend/.venv ] || python3 -m venv backend/.venv'
      - backend/.venv/bin/pip install -r backend/requirements-dev.txt

  vscode:
    desc: "Point VS Code at backend/.venv and use standard type checking (adds missing settings to .vscode/settings.json)"
    silent: true
    # Always runs (cheap); merges into any existing settings and never overwrites a value already set.
    cmds:
      - |
        python3 - <<'EOF'
        import json, pathlib, sys
        path = pathlib.Path(".vscode/settings.json")
        defaults = {
            "python.defaultInterpreterPath": "${workspaceFolder}/backend/.venv/bin/python",
            "python.analysis.typeCheckingMode": "standard",
        }
        try:
            settings = json.loads(path.read_text()) if path.exists() else {}
        except json.JSONDecodeError:
            sys.exit(f"{path} has comments or invalid JSON; add {defaults} by hand")
        added = [key for key in defaults if key not in settings]
        if added:
            settings.update({key: defaults[key] for key in added})
            path.parent.mkdir(exist_ok=True)
            path.write_text(json.dumps(settings, indent=4) + "\n")
            print(f"added {', '.join(added)} to {path}")
        EOF
