# Production stack for a single host: Caddy (TLS) -> gunicorn/Django -> PostGIS.
# Standalone (not an override of docker-compose.yml): compose merges list keys like `ports`
# and `volumes` additively, so an override couldn't drop the dev bind mount or DB port.
#
# All configuration comes from one file, backend/.env, passed as --env-file so it feeds both
# the ${...} substitutions below and (explicitly, by name) the containers:
#
#   docker compose --env-file backend/.env -f docker-compose.prod.yml up -d --build
#
# Required in backend/.env: SITE_ADDRESS, SECRET_KEY, DATABASE_PASSWORD (see .env.example).

services:
  db:
    image: imresamu/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-solar_map}
      POSTGRES_USER: ${DATABASE_USER:-solar_map}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in backend/.env}
    # No published port: only the web container reaches the database, over the compose network.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 probes over TCP; see docker-compose.yml for why not the Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    restart: unless-stopped
    # Image default CMD is gunicorn; spelled out here to enable the access log. The worker
    # count comes from WEB_CONCURRENCY, which gunicorn reads itself.
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --access-logfile -
    # Named variables rather than env_file: the container sees exactly these, and a missing
    # secret fails at `up` instead of at the first request.
    environment:
      DEBUG: "False"
      BEHIND_PROXY: "True"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in backend/.env}
      ALLOWED_HOSTS: ${SITE_ADDRESS:?set SITE_ADDRESS in backend/.env}
      CSRF_TRUSTED_ORIGINS: https://${SITE_ADDRESS}
      DATABASE_NAME: ${DATABASE_NAME:-solar_map}
      DATABASE_USER: ${DATABASE_USER:-solar_map}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: db
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Django rejects requests whose Host isn't in ALLOWED_HOSTS, so send the site's name.
      # urlopen raises on any non-2xx response, which fails the check.
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request as u;
          u.urlopen(u.Request('http://127.0.0.1:8000/', headers={'Host': os.environ['ALLOWED_HOSTS']}), timeout=4)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      # Optional extra hostname that only redirects to SITE_ADDRESS; same value = no redirect.
      REDIRECT_FROM: ${REDIRECT_FROM:-${SITE_ADDRESS}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and ACME account: losing these means re-issuing (rate limits apply).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
  caddy_config:
